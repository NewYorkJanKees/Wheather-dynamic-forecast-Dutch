<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetersWeer</title>

<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
.wrapper{max-width:460px;margin:auto;background:#fff;padding:16px;border-radius:16px}

.brand{text-align:center;font-size:22px;font-weight:800}

input{width:100%;padding:10px;margin-top:8px;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:10px;margin-top:6px;border:none;border-radius:8px;background:#3182ce;color:#fff;font-weight:700}

.hero{background:linear-gradient(135deg,#dbeafe,#bfdbfe);padding:14px;border-radius:12px;text-align:center;margin-top:10px}
.temp{font-size:42px;font-weight:800}
.small{font-size:12px;color:#444}

.hourly{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.hour{min-width:60px;background:#eee;border-radius:8px;padding:6px;text-align:center}

.error{color:red;font-weight:bold;text-align:center}
.loc{font-size:12px;text-align:center;margin-top:6px;color:#555}
</style>
</head>

<body>
<div class="wrapper">

<div class="brand">PetersWeer</div>

<div id="locatie" class="loc">Geen locatie</div>

<button onclick="gps()">📍 GPS</button>

<input id="input" placeholder="Plaats">
<button onclick="zoek()">Zoek</button>

<div id="error" class="error"></div>

<div id="dash" style="display:none">

<div class="hero">
<div id="plaatsnaam"></div>
<div id="tijd" class="small"></div>
<div class="temp" id="temp">-</div>
<div id="status"></div>
<div id="regen"></div>
</div>

<div class="hourly" id="hours"></div>

</div>

</div>

<script>

let lat=0, lon=0;
let plaats="";

function err(t){document.getElementById("error").innerText=t;}

function setPlaats(n){
    plaats = n && n.length > 1 ? n : "Onbekende locatie";
    document.getElementById("plaatsnaam").innerText = plaats;
    document.getElementById("locatie").innerText = plaats;
}

function gps(){
navigator.geolocation.getCurrentPosition(async p=>{
lat=p.coords.latitude;
lon=p.coords.longitude;

let geo=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`).then(r=>r.json());

setPlaats(
    geo.address.city ||
    geo.address.town ||
    geo.address.village
);

load();
});
}

function zoek(){
let q=document.getElementById("input").value;
if(!q) return err("Typ iets");

fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1`)
.then(r=>r.json())
.then(d=>{
if(!d.results) return err("Niet gevonden");

lat=d.results[0].latitude;
lon=d.results[0].longitude;

setPlaats(d.results[0].name + ", " + (d.results[0].country||""));

load();
});
}

function isRain(code,mm,ch){
const r=[51,53,55,61,63,65,80,81,82,95,96,99];
return r.includes(code)||mm>0.1||ch>60;
}

function regenText(code,mm,ch){
return isRain(code,mm,ch) ? "🌧️ Regen" : "☀️ Droog";
}

async function load(){

document.getElementById("dash").style.display="block";

let data=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation,precipitation_probability&timezone=auto`
).then(r=>r.json());

let now=new Date();
let uur=now.getHours();

let start=0;
for(let i=0;i<data.hourly.time.length;i++){
if(new Date(data.hourly.time[i]).getHours()===uur){
start=i;
break;
}
}

let temp=Math.round(data.current.temperature_2m);
let code=data.current.weather_code;

let mm=data.hourly.precipitation[start]||0;
let ch=data.hourly.precipitation_probability[start]||0;

document.getElementById("temp").innerText=temp+"°C";
document.getElementById("tijd").innerText=String(uur).padStart(2,'0')+":00";
document.getElementById("status").innerText="Weercode: "+code;

// ❗ FIX: geen dubbele “Droog”
document.getElementById("regen").innerText = regenText(code,mm,ch);

let h=document.getElementById("hours");
h.innerHTML="";

for(let i=start;i<start+24;i++){
if(!data.hourly.time[i]) break;

let t=new Date(data.hourly.time[i]).getHours();
let mm2=data.hourly.precipitation[i]||0;
let ch2=data.hourly.precipitation_probability[i]||0;
let c=data.hourly.weather_code[i];

let div=document.createElement("div");
div.className="hour";

div.innerHTML=`
<div>${String(t).padStart(2,'0')}:00</div>
<div>${isRain(c,mm2,ch2)?"🌧️":"☀️"}</div>
<div>${Math.round(data.hourly.temperature_2m[i])}°</div>
`;

h.appendChild(div);
}

}

</script>
</body>
</html>
