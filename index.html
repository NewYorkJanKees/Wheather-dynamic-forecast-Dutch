<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetersWeer</title>

<style>
/* ===== JOUW CSS ONGEWIJZIGD ===== */
/* plak hier je bestaande CSS exact zoals je had */
</style>
</head>

<body>

<div class="wrapper">

    <div class="brand">Peters<span>Weer</span></div>

    <div class="menu-sectie">
        <button class="gps-btn" onclick="startGPS()">📍 Gebruik GPS</button>

        <div class="search-box">
            <input id="stadInvoer" placeholder="Plaatsnaam">
            <button onclick="startHandmatig()">Zoek</button>
        </div>
    </div>

    <div id="statusMelding" class="msg-box status" style="display:none;"></div>
    <div id="foutMelding" class="msg-box error"></div>

    <div id="weerDashboard" class="dashboard" style="display:none;">

        <div id="weerLocatie" class="title-loc">-</div>
        <div id="weerTijd" class="title-time">-</div>

        <div class="glance-card">
            <div class="glance-top-row">
                <span class="hero-live-time" id="heroLiveTimeText">00:00</span>
                <span class="glance-emoji" id="heroWeatherIcon">☀️</span>
            </div>

            <div class="glance-temp" id="heroTemp">-</div>
            <div id="heroStatusText">-</div>

            <div class="hero-now-rain" id="heroImmediateRain">Laden...</div>
        </div>

        <div id="uurScrollBalk" class="hourly-scroll"></div>

    </div>

</div>

<script>

let globalWeerData = null;
let globalLat = 0;
let globalLon = 0;

/* =========================
   FIX 1: juiste tijd-index
========================= */
function getStartIndex(data) {
    let idx = data.hourly.time.findIndex(t => t === data.current.time);
    return idx >= 0 ? idx : 0;
}

/* =========================
   FIX 2: regenlogica 1 plek
========================= */
function isRegen(code, mm) {
    return mm >= 0.3 || [51,53,55,61,63,65,80,81,82,95,96,99].includes(code);
}

/* =========================
   ICONS
========================= */
function icon(code) {
    if (code === 0) return "☀️";
    if (code === 1) return "🌤️";
    if (code === 2) return "⛅";
    if (code === 3) return "☁️";
    if ([51,53,55,61,63,65,80,81,82].includes(code)) return "🌧️";
    if ([95,96,99].includes(code)) return "⚡";
    return "❓";
}

/* =========================
   LOCATIE TONEN
========================= */
function zetLocatieNaam(naam) {
    document.getElementById("weerLocatie").innerText = naam;
}

/* =========================
   REGEN TEKST
========================= */
function regenTekst(data, i) {

    let mm = data.hourly.precipitation[i] || 0;
    let code = data.hourly.weather_code[i];
    let uur = new Date(data.hourly.time[i]).getHours();

    if (isRegen(code, mm)) {

        if (i === 0) {
            return "🌧️ Het regent nu (" + mm.toFixed(1) + " mm)";
        }

        return "🌧️ Regen rond " + uur + ":00 (" + mm.toFixed(1) + " mm)";
    }

    return "☀️ Droog de komende uren";
}

/* =========================
   WEER API
========================= */
function haalWeer(lat, lon, naam) {

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}
&current=temperature_2m,weather_code,wind_speed_10m,time
&hourly=temperature_2m,weather_code,precipitation,precipitation_probability
&timezone=auto`;

fetch(url)
.then(r => r.json())
.then(data => {

globalWeerData = data;

document.getElementById("weerDashboard").style.display = "block";

zetLocatieNaam(naam);

/* FIX INDEX */
let startIndex = getStartIndex(data);

/* HERO */
document.getElementById("heroTemp").innerText =
Math.round(data.current.temperature_2m) + "°C";

document.getElementById("heroWeatherIcon").innerText =
icon(data.current.weather_code);

/* REGEN NU */
document.getElementById("heroImmediateRain").innerText =
regenTekst(data, startIndex);

/* LIVE UUR BALK */
let box = document.getElementById("uurScrollBalk");
box.innerHTML = "";

for (let i = startIndex; i < startIndex + 24; i++) {

if (!data.hourly.time[i]) break;

let mm = data.hourly.precipitation[i] || 0;
let code = data.hourly.weather_code[i];
let uur = new Date(data.hourly.time[i]).getHours();

let div = document.createElement("div");
div.className = "hourly-item";

div.innerHTML =
`<div>${uur}:00</div>
<div>${icon(code)}</div>
<div>${Math.round(data.hourly.temperature_2m[i])}°</div>
<div>${mm >= 0.3 ? "💧" + mm.toFixed(1) : "—"}</div>`;

box.appendChild(div);
}

});

}

/* =========================
   GPS
========================= */
function startGPS() {

navigator.geolocation.getCurrentPosition(pos => {

fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`)
.then(r => r.json())
.then(g => {

let naam =
(g.address.city || g.address.town || g.address.village || "Mijn locatie")
+ (g.address.country ? ", " + g.address.country : "");

zetLocatieNaam(naam);

haalWeer(pos.coords.latitude, pos.coords.longitude, naam);

});

});

}

/* =========================
   SEARCH
========================= */
function startHandmatig() {

let v = document.getElementById("stadInvoer").value;
if (!v) return;

fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${v}&count=1`)
.then(r => r.json())
.then(d => {

if (!d.results) return;

let loc = d.results[0];

let naam = loc.name + (loc.country ? ", " + loc.country : "");

zetLocatieNaam(naam);

haalWeer(loc.latitude, loc.longitude, naam);

});

}

</script>

</body>
</html>
