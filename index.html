<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetersWeer (Fixed)</title>

<style>
/* ====== JOUW CSS ONGEWIJZIGD ====== */
/* (ingekort hier om ruimte te besparen — laat jouw CSS staan) */
</style>
</head>

<body>

<div class="wrapper">

    <div class="brand">Peters<span>Weer</span></div>

    <div class="menu-sectie">
        <button class="gps-btn" onclick="startGPS()">📍 GPS</button>
        <div class="search-box">
            <input id="stadInvoer" placeholder="Plaats...">
            <button onclick="startHandmatig()">Zoek</button>
        </div>
    </div>

    <div id="weerDashboard" class="dashboard" style="display:none;">
        <div id="heroTemp"></div>
        <div id="heroWeatherIcon"></div>
        <div id="heroImmediateRain"></div>

        <div id="uurScrollBalk"></div>
    </div>

</div>

<script>

let globalWeerData = null;
let globalLat = 0;
let globalLon = 0;

/* =========================
   FIX 1: BETROUWBARE INDEX
========================= */
function getStartIndex(data) {
    const now = data.current.time;
    let idx = data.hourly.time.findIndex(t => t === now);
    return idx >= 0 ? idx : 0;
}

/* =========================
   FIX 2: REGEN LOGICA
========================= */
function isRegen(mm, code) {
    return mm >= 0.3 || [51,53,55,61,63,65,80,81,82,95,96,99].includes(code);
}

/* =========================
   FIX 3: SIMPELE ICONS
========================= */
function icon(code) {
    if (code === 0) return "☀️";
    if (code === 1) return "🌤️";
    if (code === 2) return "⛅";
    if (code === 3) return "☁️";
    if ([51,53,55,61,63,65,80,81,82].includes(code)) return "🌧️";
    if ([95,96,99].includes(code)) return "⚡";
    return "❓";
}

/* =========================
   FIX 4: REGEN TEKST NU CORRECT
========================= */
function regenTekst(data, i) {
    const mm = data.hourly.precipitation[i] || 0;
    const code = data.hourly.weather_code[i];
    const uur = new Date(data.hourly.time[i]).getHours();

    if (isRegen(mm, code)) {
        if (i === 0) return `🌧️ Het regent nu (${mm.toFixed(1)} mm)`;
        return `🌧️ Regen rond ${uur}:00 (${mm.toFixed(1)} mm)`;
    }
    return "☀️ Droog komende uren";
}

/* =========================
   WEER OPHALEN
========================= */
function haalWeer(lat, lon, naam) {

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}
&current=temperature_2m,weather_code,wind_speed_10m
&hourly=temperature_2m,weather_code,precipitation,precipitation_probability
&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code
&timezone=auto`;

fetch(url)
.then(r => r.json())
.then(data => {

globalWeerData = data;

document.getElementById("weerDashboard").style.display = "block";

/* ===== FIX INDEX ===== */
const startIndex = getStartIndex(data);

/* ===== HERO ===== */
document.getElementById("heroTemp").innerText =
Math.round(data.current.temperature_2m) + "°C";

document.getElementById("heroWeatherIcon").innerText =
icon(data.current.weather_code);

/* ===== BELANGRIJK: CORRECTE REGEN ===== */
document.getElementById("heroImmediateRain").innerText =
regenTekst(data, startIndex);

/* ===== 24u BALK ===== */
const box = document.getElementById("uurScrollBalk");
box.innerHTML = "";

for (let i = startIndex; i < startIndex + 24; i++) {
if (!data.hourly.time[i]) break;

const mm = data.hourly.precipitation[i] || 0;
const code = data.hourly.weather_code[i];
const uur = new Date(data.hourly.time[i]).getHours();

const div = document.createElement("div");
div.style = "display:inline-block;margin:5px;padding:6px;background:#eee;border-radius:8px;font-size:12px;";

div.innerHTML =
`<div>${uur}:00</div>
<div>${icon(code)}</div>
<div>${Math.round(data.hourly.temperature_2m[i])}°</div>
<div>${mm > 0 ? "💧" + mm.toFixed(1) : "—"}</div>`;

box.appendChild(div);
}

})
.catch(err => {
console.log(err);
alert("Weerdata fout");
});

}

/* =========================
   INPUTS
========================= */
function startHandmatig() {
const v = document.getElementById("stadInvoer").value;
if (!v) return;

fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${v}&count=1&language=nl`)
.then(r => r.json())
.then(d => {
const loc = d.results[0];
haalWeer(loc.latitude, loc.longitude, loc.name);
});
}

function startGPS() {
navigator.geolocation.getCurrentPosition(pos => {
haalWeer(pos.coords.latitude, pos.coords.longitude, "Mijn locatie");
});
}

</script>

</body>
</html>
