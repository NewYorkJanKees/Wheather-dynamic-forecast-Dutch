<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weer Fix</title>

<style>
body { font-family: Arial; margin:0; background:#f2f2f2; }
.wrapper { max-width:500px; margin:auto; padding:15px; background:white; }

.top { text-align:center; font-size:20px; font-weight:bold; margin-bottom:10px; }
.loc { text-align:center; font-size:14px; color:#555; margin-bottom:10px; }

.hero { text-align:center; padding:15px; background:linear-gradient(#cfe8ff,#e8f4ff); border-radius:12px; margin-bottom:10px; }
.temp { font-size:40px; font-weight:bold; }
.icon { font-size:30px; }

.btn { width:100%; padding:10px; margin:5px 0; border:none; border-radius:8px; cursor:pointer; }
.gps { background:#2ecc71; color:white; }
.search { background:#3498db; color:white; }

input { width:100%; padding:10px; margin-top:5px; }

.hour { display:flex; overflow-x:auto; gap:10px; }
.card { min-width:70px; background:#eee; padding:8px; border-radius:8px; text-align:center; }

.rainbox { margin-top:10px; font-weight:bold; }
</style>
</head>

<body>

<div class="wrapper">

<div class="top">Weer App</div>
<div class="loc" id="plaats">Geen locatie</div>

<button class="btn gps" onclick="gps()">📍 GPS</button>

<input id="input">
<button class="btn search" onclick="zoek()">Zoek</button>

<div class="hero">
<div class="icon" id="icoon">☀️</div>
<div class="temp" id="temp">-</div>
<div id="status">-</div>
<div class="rainbox" id="regen">-</div>
</div>

<div class="hour" id="uren"></div>

</div>

<script>

let dataGlobal;
let lat, lon;

function gps(){
navigator.geolocation.getCurrentPosition(async p=>{
lat=p.coords.latitude;
lon=p.coords.longitude;

let geo = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`).then(r=>r.json());
document.getElementById("plaats").innerText =
(geo.address.city || geo.address.town || "Onbekend") + ", " + (geo.address.country || "");

haalWeer();
});
}

function zoek(){
let q=document.getElementById("input").value;
fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1&language=nl`)
.then(r=>r.json()).then(d=>{
lat=d.results[0].latitude;
lon=d.results[0].longitude;

document.getElementById("plaats").innerText =
d.results[0].name + ", " + d.results[0].country;

haalWeer();
});
}

function icoon(code){
if(code==0) return "☀️";
if(code<=2) return "🌤️";
if(code==3) return "☁️";
if(code>=61 && code<=82) return "🌧️";
if(code>=95) return "⛈️";
return "❓";
}

function isRegen(code, mm, kans){
return (code>=61 && code<=82) || mm>0.2 || kans>40;
}

function haalWeer(){
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation,precipitation_probability&timezone=auto`)
.then(r=>r.json()).then(d=>{
dataGlobal=d;

document.getElementById("temp").innerText =
Math.round(d.current.temperature_2m)+"°C";

document.getElementById("icoon").innerText =
icoon(d.current.weather_code);

document.getElementById("status").innerText =
d.current.weather_code>=61 ? "Regenachtig" : "Droog";

let uren=document.getElementById("uren");
uren.innerHTML="";

for(let i=0;i<24;i++){
let code=d.hourly.weather_code[i];
let mm=d.hourly.precipitation[i];
let kans=d.hourly.precipitation_probability[i];

uren.innerHTML+=`
<div class="card">
<div>${icoon(code)}</div>
<div>${Math.round(d.hourly.temperature_2m[i])}°</div>
<div>${isRegen(code,mm,kans)?"💧":"☀️"}</div>
</div>`;
}

let now = d.current.weather_code;
let mmNow = d.hourly.precipitation[0];
let kansNow = d.hourly.precipitation_probability[0];

document.getElementById("regen").innerText =
isRegen(now, mmNow, kansNow)
? "🌧️ Kans op regen / nat"
: "☀️ Droog";

});
}

</script>

</body>
</html>
