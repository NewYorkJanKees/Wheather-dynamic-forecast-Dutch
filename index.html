<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetersWeer FIX</title>

<style>
body { font-family: Arial; margin:0; background:#eef2f7; }
.wrapper { max-width:460px; margin:auto; background:white; padding:12px; }

.brand { font-size:22px; font-weight:800; text-align:center; }

.hero { background:#dbeafe; padding:16px; border-radius:12px; text-align:center; margin:10px 0; }
.temp { font-size:44px; font-weight:800; }
.status { font-weight:700; margin-top:4px; }
.small { color:#555; font-size:13px; }

input, button { padding:10px; margin-top:6px; width:100%; }

.hourly { display:flex; overflow-x:auto; gap:8px; margin-top:10px; }
.hour { min-width:70px; background:#f3f4f6; padding:8px; border-radius:8px; text-align:center; }

.bad { color:red; font-weight:700; }
.good { color:green; font-weight:700; }
</style>
</head>

<body>
<div class="wrapper">

<div class="brand">PetersWeer</div>

<div>
<button onclick="gps()">📍 GPS</button>
<input id="city" placeholder="Plaats..." />
<button onclick="searchCity()">Zoek</button>
</div>

<div class="small" id="place">Plaats: -</div>

<div class="hero">
<div id="icon">☀️</div>
<div class="temp" id="temp">-</div>
<div class="status" id="status">-</div>
<div class="small" id="rainNow">-</div>
</div>

<div class="small">Komende uren</div>
<div class="hourly" id="hourly"></div>

</div>

<script>

let dataGlobal = null;
let latG, lonG;

function setPlace(name){
    document.getElementById("place").innerText = "Plaats: " + (name || "Onbekend");
}

function gps(){
    navigator.geolocation.getCurrentPosition(async pos=>{
        latG = pos.coords.latitude;
        lonG = pos.coords.longitude;

        let geo = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latG}&lon=${lonG}&format=json`).then(r=>r.json());

        let name =
            geo.address.city ||
            geo.address.town ||
            geo.address.village ||
            geo.display_name ||
            "GPS locatie";

        setPlace(name);
        loadWeather(latG, lonG);
    });
}

function searchCity(){
    let c = document.getElementById("city").value;
    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${c}&count=1`)
    .then(r=>r.json())
    .then(d=>{
        if(!d.results) return;

        latG = d.results[0].latitude;
        lonG = d.results[0].longitude;

        setPlace(d.results[0].name + ", " + d.results[0].country);
        loadWeather(latG, lonG);
    });
}

function weatherIcon(code){
    if(code==0) return "☀️";
    if(code<=2) return "🌤️";
    if(code==3) return "☁️";
    if([51,53,55].includes(code)) return "🌦️";
    if([61,63,65,80,81,82].includes(code)) return "🌧️";
    if([95,96,99].includes(code)) return "⚡";
    return "🌫️";
}

function isRain(mm, prob){
    return mm > 0.1 || prob > 60;
}

async function loadWeather(lat, lon){

    let url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation,precipitation_probability&timezone=auto`;

    dataGlobal = await fetch(url).then(r=>r.json());

    let c = dataGlobal.current;
    let h = dataGlobal.hourly;

    document.getElementById("temp").innerText = Math.round(c.temperature_2m) + "°C";

    document.getElementById("icon").innerText = weatherIcon(c.weather_code);

    document.getElementById("status").innerText =
        isRain(h.precipitation[0], h.precipitation_probability[0])
        ? "Regenachtig"
        : "Droog";

    document.getElementById("rainNow").innerText =
        isRain(h.precipitation[0], h.precipitation_probability[0])
        ? "⚠️ Kans op regen nu/komend uur"
        : "✅ Droog komende uren";

    let box = document.getElementById("hourly");
    box.innerHTML = "";

    for(let i=0;i<24;i++){
        let mm = h.precipitation[i];
        let prob = h.precipitation_probability[i];
        let code = h.weather_code[i];
        let time = new Date(h.time[i]).getHours();

        let el = document.createElement("div");
        el.className="hour";

        el.innerHTML = `
            <div>${time}:00</div>
            <div>${weatherIcon(code)}</div>
            <div>${Math.round(h.temperature_2m[i])}°</div>
            <div style="font-size:11px">
                ${isRain(mm,prob) ? "🌧️" : "☁️"}
            </div>
        `;

        box.appendChild(el);
    }
}

</script>
</body>
</html>
