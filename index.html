<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weer</title>

<style>
body { margin:0; font-family:Arial; background:#f2f2f2; }
.wrapper { max-width:520px; margin:auto; background:white; padding:12px; }

.top { text-align:center; font-weight:bold; font-size:20px; }
.loc { text-align:center; color:#555; margin-bottom:10px; }

.hero { background:linear-gradient(#cfe8ff,#eaf4ff); padding:15px; border-radius:12px; text-align:center; }
.temp { font-size:42px; font-weight:bold; }
.icon { font-size:30px; }

input, button { width:100%; padding:10px; margin-top:6px; border-radius:8px; border:none; }
.gps { background:#2ecc71; color:white; }
.search { background:#3498db; color:white; color:white; }

.hourly { display:flex; overflow-x:auto; gap:8px; margin-top:10px; }
.card { min-width:70px; background:#eee; padding:8px; border-radius:8px; text-align:center; }
</style>

</head>

<body>

<div class="wrapper">

<div class="top">Weer App</div>
<div class="loc" id="plaats">Geen locatie</div>

<button class="gps" onclick="gps()">📍 GPS</button>

<input id="input" placeholder="Plaats">
<button class="search" onclick="zoek()">Zoek</button>

<div class="hero">
<div class="icon" id="icoon">☀️</div>
<div class="temp" id="temp">-</div>
<div id="status">-</div>
<div id="regen">-</div>
</div>

<div class="hourly" id="uren"></div>

</div>

<script>

let lat, lon;

/* ------------------ LOCATIE (100% consistent) ------------------ */

function setPlaats(name){
if(!name) name = "Onbekend";
document.getElementById("plaats").innerText = name;
localStorage.setItem("plaats", name);
}

/* ------------------ GPS ------------------ */

function gps(){
navigator.geolocation.getCurrentPosition(async p=>{
lat = p.coords.latitude;
lon = p.coords.longitude;

let geo = await fetch(
`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`
).then(r=>r.json());

let naam =
geo.address.city ||
geo.address.town ||
geo.address.village ||
geo.address.municipality ||
"Mijn locatie";

setPlaats(naam + ", " + (geo.address.country || ""));

haalWeer();
});
}

/* ------------------ SEARCH ------------------ */

function zoek(){
let q = document.getElementById("input").value;
if(!q) return;

fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1&language=nl`)
.then(r=>r.json())
.then(d=>{
if(!d.results || !d.results.length){
setPlaats("Niet gevonden");
return;
}

lat = d.results[0].latitude;
lon = d.results[0].longitude;

setPlaats(d.results[0].name + ", " + d.results[0].country);

haalWeer();
});
}

/* ------------------ ICONEN ------------------ */

function icoon(code){
if(code === 0) return "☀️";
if(code <= 2) return "🌤️";
if(code === 3) return "☁️";
if(code >= 61 && code <= 82) return "🌧️";
if(code >= 95) return "⛈️";
return "❓";
}

/* ------------------ REGEN LOGICA (BETROUWBAAR) ------------------ */

function isRegen(code, mm, kans){
if(code >= 95) return true;
if(mm > 0.25) return true;
if(kans > 60) return true;
return false;
}

/* ------------------ WEER ------------------ */

function haalWeer(){
fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation,precipitation_probability&timezone=auto`)
.then(r=>r.json())
.then(d=>{

document.getElementById("temp").innerText =
Math.round(d.current.temperature_2m) + "°C";

document.getElementById("icoon").innerText =
icoon(d.current.weather_code);

document.getElementById("status").innerText =
(d.current.weather_code >= 61 ? "Onstabiel / Regen" : "Droog");

/* 🔥 BELANGRIJK: juiste “nu” index */
let now = new Date().getHours();
let i = d.hourly.time.findIndex(t => new Date(t).getHours() === now);
if(i < 0) i = 0;

let mm = d.hourly.precipitation[i];
let kans = d.hourly.precipitation_probability[i];

document.getElementById("regen").innerText =
isRegen(d.current.weather_code, mm, kans)
? "🌧️ Kans op regen"
: "☀️ Droog";

/* uur balk */
let uren = document.getElementById("uren");
uren.innerHTML = "";

for(let x=0; x<24; x++){
let code = d.hourly.weather_code[x];
let mm2 = d.hourly.precipitation[x];
let kans2 = d.hourly.precipitation_probability[x];

uren.innerHTML += `
<div class="card">
<div>${icoon(code)}</div>
<div>${Math.round(d.hourly.temperature_2m[x])}°</div>
<div>${isRegen(code, mm2, kans2) ? "💧" : "☀️"}</div>
</div>`;
}

});
}

/* ------------------ INIT ------------------ */

window.onload = () => {
let saved = localStorage.getItem("plaats");
if(saved) setPlaats(saved);
};

</script>

</body>
</html>
